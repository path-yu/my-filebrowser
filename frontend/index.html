<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no"
    />

    <title>文件管理系统</title>

    <link rel="icon" type="image/svg+xml" href="/img/icons/favicon.svg" />
    <link rel="shortcut icon" href="/img/icons/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/img/icons/apple-touch-icon.png"
    />
    <meta name="apple-mobile-web-app-title" content="文件管理系统" />

    <!-- Add to home screen for Android and modern mobile browsers -->
    <link
      rel="manifest"
      id="manifestPlaceholder"
      crossorigin="use-credentials"
    />
    <meta name="theme-color" content="#2979ff" />

    <!-- Inject Some Variables and generate the manifest json -->
    <script>
      // We can assign JSON directly
      window.FileBrowser = {
        AuthMethod: "json",
        BaseURL: "",
        CSS: false,
        Color: "",
        DisableExternal: false,
        DisableUsedPercentage: false,
        EnableExec: true,
        EnableThumbs: true,
        LogoutPage: "",
        LoginPage: true,
        Name: "",
        NoAuth: false,
        ReCaptcha: false,
        ResizePreview: true,
        Signup: false,
        StaticURL: "",
        Theme: "",
        TusSettings: { chunkSize: 10485760, retryCount: 5 },
        Version: "(untracked)",
      };
      // Global function to prepend static url
      window.__prependStaticUrl = (url) => {
        return `${window.FileBrowser.StaticURL}/${url.replace(/^\/+/, "")}`;
      };
      var dynamicManifest = {
        name: window.FileBrowser.Name || "文件管理系统",
        short_name: window.FileBrowser.Name || "文件管理系统",
        icons: [
          {
            src: window.__prependStaticUrl(
              "/img/icons/android-chrome-192x192.png"
            ),
            sizes: "192x192",
            type: "image/png",
          },
          {
            src: window.__prependStaticUrl(
              "/img/icons/android-chrome-512x512.png"
            ),
            sizes: "512x512",
            type: "image/png",
          },
        ],
        start_url: window.location.origin + window.FileBrowser.BaseURL,
        display: "standalone",
        background_color: "#ffffff",
        theme_color: window.FileBrowser.Color || "#455a64",
      };

      const stringManifest = JSON.stringify(dynamicManifest);
      const blob = new Blob([stringManifest], { type: "application/json" });
      const manifestURL = URL.createObjectURL(blob);
      document
        .querySelector("#manifestPlaceholder")
        .setAttribute("href", manifestURL);

      // ============================================================
      // 【关键】在 Loading 渲染前，给 <html> 加 light/dark class，
      // 让 iOS Loading 遮罩的 html.light / html.dark CSS 首屏命中。
      //
      // 优先级（用户配置 > 一切）：
      //   1) localStorage['fb_theme'] — 用户在 App 里手动切换过的主题
      //   2) window.FileBrowser.Theme  — 后端注入/配置里的主题（浅色/深色）
      //   3) 都没有时：默认 "light"（filebrowser 出厂默认浅色）
      //
      //  ❌ 不再用 matchMedia 跟随系统偏好：用户系统是深色模式时，
      //     会把用户显式配置的浅色给覆盖掉，造成“配置是浅色但刷新变黑”。
      // ============================================================
      (function () {
        var html = document.documentElement;
        var t = "";
        try {
          var saved = localStorage.getItem("fb_theme");
          if (saved === "light" || saved === "dark") { t = saved; }
        } catch (e) { /* ignore */ }
        if (!t) {
          var cfg = (window.FileBrowser && window.FileBrowser.Theme) || "";
          if (cfg === "light" || cfg === "dark") { t = cfg; }
        }
        // 最终兜底：默认浅色
        if (!t) { t = "light"; }
        html.classList.add(t);
      })();
    </script>

    <style>
      /* ============================================================
         iOS 风格全屏 Loading
         主题统一用 html.light / html.dark（和 App 主题系统一致），
         不再使用 @media (prefers-color-scheme)，避免「系统 = 深色 +
         App = 亮色」时出现深灰卡片叠加亮色背景的违和感。
         所有关键属性加 !important，防止被 styles.css 的 #loading
         选择器覆盖。
         ============================================================ */
      #loading {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        background: #F2F2F7 !important;     /* iOS 浅灰背景（亮） */
        z-index: 9999 !important;
        transition: 0.2s ease opacity;
        -webkit-transition: 0.2s ease opacity;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      /* 深色模式：html.dark 下 #loading 背景 = 纯黑 */
      html.dark #loading {
        background: #000 !important;
      }

      #loading.done {
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- 毛玻璃卡片：亮色默认（白毛玻璃） ---------- */
      #loading .loader-card {
        background: rgba(255, 255, 255, 0.72) !important;
        -webkit-backdrop-filter: blur(28px) saturate(180%) !important;
        backdrop-filter: blur(28px) saturate(180%) !important;
        border-radius: 22px;
        padding: 32px 40px;
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.06),
          0 18px 48px rgba(0, 0, 0, 0.14);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 160px;
        gap: 16px;
        border: 0.5px solid rgba(0, 0, 0, 0.04);
      }
      /* ---------- 毛玻璃卡片：html.dark（深灰毛玻璃） ---------- */
      html.dark #loading .loader-card {
        background: rgba(44, 44, 46, 0.72) !important;
        border-color: rgba(255, 255, 255, 0.06) !important;
        box-shadow:
          0 2px 6px rgba(0, 0, 0, 0.20),
          0 18px 48px rgba(0, 0, 0, 0.50);
      }

      /* ---------- Spinner：8 段 bar 均匀分布 + 整体旋转 ---------- */
      #loading .spinner {
        width: 44px;
        height: 44px;
        position: relative;
        animation: ios-spin 0.85s linear infinite;
        -webkit-animation: ios-spin 0.85s linear infinite;
      }
      #loading .spinner i {
        position: absolute;
        left: 50%;
        top: 0;
        width: 4px;
        height: 10px;
        margin-left: -2px;
        border-radius: 2px;
        background: #007AFF !important;      /* iOS 亮主蓝 */
        opacity: 0;
        /* 旋转中心 = bar 自身 x 中心(2px)，y 方向向下 22px = spinner 几何中心(22,22) */
        transform-origin: 2px 22px;
        -webkit-transform-origin: 2px 22px;
      }
      /* 8 个 bar 均匀分布 0~315 度，透明度递减模拟 iOS 渐变扇形 */
      #loading .spinner i:nth-child(1) { transform: rotate(0deg);   -webkit-transform: rotate(0deg);   opacity: 1;    }
      #loading .spinner i:nth-child(2) { transform: rotate(45deg);  -webkit-transform: rotate(45deg);  opacity: 0.875;}
      #loading .spinner i:nth-child(3) { transform: rotate(90deg);  -webkit-transform: rotate(90deg);  opacity: 0.75; }
      #loading .spinner i:nth-child(4) { transform: rotate(135deg); -webkit-transform: rotate(135deg); opacity: 0.625;}
      #loading .spinner i:nth-child(5) { transform: rotate(180deg); -webkit-transform: rotate(180deg); opacity: 0.5;  }
      #loading .spinner i:nth-child(6) { transform: rotate(225deg); -webkit-transform: rotate(225deg); opacity: 0.375;}
      #loading .spinner i:nth-child(7) { transform: rotate(270deg); -webkit-transform: rotate(270deg); opacity: 0.25; }
      #loading .spinner i:nth-child(8) { transform: rotate(315deg); -webkit-transform: rotate(315deg); opacity: 0.125;}

      /* 深色模式：spinner bar 色 = iOS 暗主蓝 */
      html.dark #loading .spinner i {
        background: #0A84FF !important;
      }

      @keyframes ios-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @-webkit-keyframes ios-spin {
        0%   { -webkit-transform: rotate(0deg); }
        100% { -webkit-transform: rotate(360deg); }
      }

      /* ---------- 「加载中...」文字 ---------- */
      #loading .loader-text {
        font-size: 14px;
        font-weight: 500;
        color: #3C3C43 !important;           /* iOS 亮主文字深灰（在白毛玻璃上清晰可读） */
        letter-spacing: 0.02em;
        margin: 0;
      }
      /* 深色模式：文字 = 浅灰 */
      html.dark #loading .loader-text {
        color: #EBEBF5 !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="loading">
      <!-- 定制：iOS 风格加载卡片 -->
      <div class="loader-card">
        <div class="spinner">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <p class="loader-text">加载中...</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
